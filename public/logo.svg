<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="sfBg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121624"/>
      <stop offset="52%" stop-color="#090b12"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="sfRim" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#30d158" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="sfAccent" x1="26" y1="24" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#30d158"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sfGold" x1="44" y1="20" x2="84" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sfGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#30d158" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Apple Squircle Dark Glass Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#sfBg)" stroke="url(#sfRim)" stroke-width="2.5"/>
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#sfGlow)"/>

  <!-- Outer Precision Ring -->
  <circle cx="64" cy="68" r="36" stroke="url(#sfAccent)" stroke-width="3" stroke-dasharray="14 6" opacity="0.45"/>

  <!-- Steam Piston Crank Arm & Hub -->
  <path d="M35 83 L62 64 L88 76" stroke="url(#sfAccent)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="35" cy="83" r="9.5" fill="#0b0f19" stroke="#38bdf8" stroke-width="4.5"/>
  <circle cx="88" cy="76" r="8.5" fill="#0b0f19" stroke="#a855f7" stroke-width="4"/>

  <!-- Central Rotor Core -->
  <circle cx="62" cy="64" r="14" fill="#0b0f19" stroke="url(#sfAccent)" stroke-width="5"/>
  <circle cx="62" cy="64" r="5.5" fill="#30d158"/>

  <!-- Achievement Trophy / Crown Spark at Top -->
  <path d="M64 21 L68.5 31.5 L80 33 L71.5 40.5 L73.8 51.5 L64 46 L54.2 51.5 L56.5 40.5 L48 33 L59.5 31.5 Z" fill="url(#sfGold)"/>
</svg>
